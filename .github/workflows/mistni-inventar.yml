name: Místní inventář

on:
  schedule:
    - cron: "17 3 * * *"   # denně ve 3:17 UTC = 5:17 letního / 4:17 zimního času
  workflow_dispatch:       # ruční spuštění tlačítkem „Run workflow“

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vygenerovat inventář
        run: python generate.py
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          GOOGLE_FEED_URL: ${{ secrets.GOOGLE_FEED_URL }}

      - name: Uložit změny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mistni-inventar.tsv
          if [ -f oprava-nazvu.tsv ]; then git add oprava-nazvu.tsv; fi
          git diff --cached --quiet || git commit -m "Denní aktualizace $(date -u +%Y-%m-%d)"
          git push
